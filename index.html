<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿吱阿佐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1.5s ease;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            /* 默认夜间模式 */
            background-color: #0c0c0c;
        }
        
        /* 日间模式 (6:00-18:00) */
        body.daytime {
            background-color: #f0f8ff;
        }
        
        .avatar-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 35px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            /* 外沿发光效果 - 夜间模式 */
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.3),
                0 0 15px 8px rgba(200, 230, 255, 0.6);
            /* 16秒旋转一圈 */
            animation: spin 16s linear infinite;
        }
        
        /* 日间头像发光效果 */
        body.daytime .avatar {
            box-shadow: 
                0 0 0 3px rgba(0, 0, 0, 0.15),
                0 0 15px 8px rgba(255, 215, 0, 0.4);
        }
        
        .name {
            font-size: 36px;
            letter-spacing: 6px;
            font-weight: 500;
            /* 夜间文字颜色 */
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
        
        /* 日间文字颜色 */
        body.daytime .name {
            color: #2c3e50;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 背景装饰 */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }
        
        /* 夜间背景元素 */
        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 15%;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.1) 0%, transparent 70%);
        }
        
        .bg-element:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: 25%;
            right: 15%;
            background: radial-gradient(circle, rgba(150, 200, 255, 0.1) 0%, transparent 70%);
        }
        
        /* 日间背景元素 */
        body.daytime .bg-element:nth-child(1) {
            background: radial-gradient(circle, rgba(100, 180, 255, 0.1) 0%, transparent 70%);
        }
        
        body.daytime .bg-element:nth-child(2) {
            background: radial-gradient(circle, rgba(255, 200, 100, 0.1) 0%, transparent 70%);
        }
        
        /* 夜间星空效果 */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }
        
        body.daytime .stars {
            opacity: 0;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        
        /* 昼夜转换按钮 */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 3px;
            transition: background 0.5s ease;
        }
        
        body.daytime .theme-toggle {
            background: rgba(0, 0, 0, 0.1);
        }
        
        .toggle-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffd700;
            transition: transform 0.5s ease;
        }
        
        body.daytime .toggle-circle {
            transform: translateX(24px);
            background: #2c3e50;
        }
    </style>
</head>
<body>
    <!-- 背景元素 -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>
    
    <!-- 昼夜切换按钮 -->
    <div class="theme-toggle" id="themeToggle">
        <div class="toggle-circle"></div>
    </div>
    
    <div class="avatar-container">
        <img src="https://s21.ax1x.com/2024/11/29/pA58nwn.jpg" alt="阿吱阿佐的头像" class="avatar">
    </div>
    
    <div class="name">阿吱阿佐</div>

    <script>
        // 创建星空背景
        function createStars() {
            const stars = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机位置和大小
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // 随机闪烁动画
                const duration = 1 + Math.random() * 4;
                star.style.animation = `twinkle ${duration}s infinite alternate`;
                
                stars.appendChild(star);
            }
        }
        
        // 添加闪烁动画
        document.styleSheets[0].insertRule(
            `@keyframes twinkle {
                0% { opacity: 0.3; }
                100% { opacity: 0.9; }
            }`, 
            document.styleSheets[0].cssRules.length
        );
        
        // 检查当前是否为日间 (6:00-18:00)
        function isDaytime() {
            const now = new Date();
            const hours = now.getHours();
            return hours >= 6 && hours < 18;
        }
        
        // 切换主题
        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('daytime')) {
                body.classList.remove('daytime');
            } else {
                body.classList.add('daytime');
            }
        }
        
        // 更新主题
        function updateTheme() {
            const body = document.body;
            if (isDaytime()) {
                body.classList.add('daytime');
            } else {
                body.classList.remove('daytime');
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            updateTheme();
            
            // 添加切换按钮事件
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            
            // 每分钟检查一次时间变化
            setInterval(updateTheme, 60000);
        });
    </script>
</body>
</html>
