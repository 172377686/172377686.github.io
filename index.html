<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿吱阿佐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1.5s ease;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            /* 默认夜间模式 */
            background: radial-gradient(circle at center, #0c0c0c, #000);
        }
        
        /* 日间模式 (6:00-18:00) */
        body.daytime {
            background: radial-gradient(circle at center, #f0f9ff, #c2e9fb);
        }
        
        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 35px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            /* 外沿发光效果 - 夜间模式 */
            box-shadow: 
                0 0 0 3px rgba(100, 150, 255, 0.3),
                0 0 20px 10px rgba(100, 150, 255, 0.5);
            /* 16秒旋转一圈 */
            animation: spin 16s linear infinite;
        }
        
        /* 日间头像发光效果 */
        body.daytime .avatar {
            box-shadow: 
                0 0 0 3px rgba(255, 200, 50, 0.3),
                0 0 20px 10px rgba(255, 200, 50, 0.4);
        }
        
        .name {
            font-size: 42px;
            letter-spacing: 8px;
            font-weight: 500;
            /* 夜间文字颜色 */
            color: #ffffff;
            text-shadow: 0 0 15px rgba(100, 150, 255, 0.8);
            opacity: 1;
            transition: opacity 2s ease-in-out;
        }
        
        /* 日间文字颜色 */
        body.daytime .name {
            color: #2c3e50;
            text-shadow: 0 0 15px rgba(255, 200, 50, 0.5);
        }
        
        /* 文字消失动画 */
        .name.hidden {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 背景装饰 */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }
        
        /* 夜间背景元素 */
        .bg-element:nth-child(1) {
            width: 350px;
            height: 350px;
            top: 10%;
            left: 10%;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.1) 0%, transparent 70%);
            animation: float 15s infinite alternate ease-in-out;
        }
        
        .bg-element:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: 15%;
            right: 15%;
            background: radial-gradient(circle, rgba(150, 100, 255, 0.1) 0%, transparent 70%);
            animation: float 12s infinite alternate-reverse ease-in-out;
        }
        
        /* 日间背景元素 */
        body.daytime .bg-element:nth-child(1) {
            background: radial-gradient(circle, rgba(100, 200, 255, 0.2) 0%, transparent 70%);
        }
        
        body.daytime .bg-element:nth-child(2) {
            background: radial-gradient(circle, rgba(255, 200, 100, 0.2) 0%, transparent 70%);
        }
        
        /* 动画效果 */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }
        
        /* 倒计时提示 */
        .countdown {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 14px;
            opacity: 0.6;
            transition: opacity 0.5s;
        }
        
        body.daytime .countdown {
            color: #2c3e50;
        }
        
        .countdown.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- 背景元素 -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <!-- 主内容 -->
    <div class="avatar-container">
        <img src="https://s21.ax1x.com/2024/11/29/pA58nwn.jpg" alt="阿吱阿佐的头像" class="avatar">
    </div>
    
    <div class="name" id="name">阿吱阿佐</div>
    
    <div class="countdown" id="countdown">文字将在10秒后消失...</div>

    <script>
        // 检查当前是否为日间 (6:00-18:00)
        function isDaytime() {
            const now = new Date();
            const hours = now.getHours();
            return hours >= 6 && hours < 18;
        }
        
        // 更新主题
        function updateTheme() {
            const body = document.body;
            if (isDaytime()) {
                body.classList.add('daytime');
            } else {
                body.classList.remove('daytime');
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateTheme();
            
            const nameElement = document.getElementById('name');
            const countdownElement = document.getElementById('countdown');
            
            // 文字消失倒计时
            let seconds = 10;
            const countdownInterval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    nameElement.classList.add('hidden');
                    countdownElement.textContent = "文字已隐藏，刷新页面可恢复";
                    setTimeout(() => {
                        countdownElement.classList.add('hidden');
                    }, 3000);
                } else {
                    countdownElement.textContent = `文字将在${seconds}秒后消失...`;
                }
            }, 1000);
        });
    </script>
</body>
</html>
