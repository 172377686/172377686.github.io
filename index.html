<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿吱阿佐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1.5s ease;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at center, #0c0c0c, #000);
        }
        
        body.daytime {
            background: radial-gradient(circle at center, #f0f9ff, #c2e9fb);
        }
        
        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 35px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 0 3px rgba(100, 150, 255, .3), 0 0 20px 10px rgba(100, 150, 255, .5);
            animation: spin 16s linear infinite;
            cursor: pointer;
        }
        
        .avatar.paused {
            animation-play-state: paused;
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        body.daytime .avatar {
            box-shadow: 0 0 0 3px rgba(255, 200, 50, .3), 0 0 20px 10px rgba(255, 200, 50, .4);
        }
        
        .name {
            font-size: 42px;
            letter-spacing: 8px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 0 15px rgba(100, 150, 255, .8);
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
            cursor: pointer;
            text-align: center;
            padding: 0 20px;
        }
        
        .name:hover {
            transform: scale(1.03);
        }
        
        body.daytime .name {
            color: #2c3e50;
            text-shadow: 0 0 15px rgba(255, 200, 50, .5);
        }
        
        .name.hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }
        
        .bg-element {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }
        
        .bg-element:nth-child(1) {
            width: 350px;
            height: 350px;
            top: 10%;
            left: 10%;
            background: radial-gradient(circle, rgba(100, 150, 255, .1) 0, transparent 70%);
            animation: float 15s infinite alternate ease-in-out;
        }
        
        .bg-element:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: 15%;
            right: 15%;
            background: radial-gradient(circle, rgba(150, 100, 255, .1) 0, transparent 70%);
            animation: float 12s infinite alternate-reverse ease-in-out;
        }
        
        body.daytime .bg-element:nth-child(1) {
            background: radial-gradient(circle, rgba(100, 200, 255, .2) 0, transparent 70%);
        }
        
        body.daytime .bg-element:nth-child(2) {
            background: radial-gradient(circle, rgba(255, 200, 100, .2) 0, transparent 70%);
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }
        
        /* 音乐播放器样式 */
        .music-player {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        body.daytime .music-player {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .music-control {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .music-control:hover {
            background: rgba(100, 150, 255, 0.5);
            transform: scale(1.08);
        }
        
        body.daytime .music-control {
            background: rgba(255, 200, 50, 0.3);
        }
        
        body.daytime .music-control:hover {
            background: rgba(255, 200, 50, 0.5);
        }
        
        .music-info {
            color: white;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 120px;
        }
        
        body.daytime .music-info {
            color: #2c3e50;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .name {
                font-size: 32px;
                letter-spacing: 5px;
            }
            
            .avatar-container {
                width: 160px;
                height: 160px;
                margin-bottom: 25px;
            }
            
            .music-player {
                bottom: 15px;
                padding: 8px 15px;
                gap: 10px;
            }
            
            .music-info {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <!-- 音乐播放器 -->
    <div class="music-player" id="musicPlayer">
        <div class="music-control" id="playBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 3L12 8L4 13V3Z" fill="currentColor"/>
            </svg>
        </div>
        <div class="music-info" id="musicInfo">芊芊龍 - 期待夏天</div>
    </div>
    
    <div class="avatar-container">
        <img src="https://s21.ax1x.com/2024/11/29/pA58nwn.jpg" alt="阿吱阿佐的头像" class="avatar" id="avatar">
    </div>
    
    <div class="name" id="name">阿吱阿佐</div>

    <script>
        // 昼夜模式检测
        function isDaytime() {
            const h = new Date().getHours();
            return h >= 6 && h < 18;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            if (isDaytime()) document.body.classList.add('daytime');
            
            const nameElement = document.getElementById('name');
            const avatar = document.getElementById('avatar');
            const playBtn = document.getElementById('playBtn');
            const musicInfo = document.getElementById('musicInfo');
            
            // 音乐播放器功能
            let audio = null;
            let isPlaying = false;
            const musicUrl = "https://music.163.com/song/media/outer/url?id=2740145320.mp3";
            const musicTitle = "芊芊龍 - 期待夏天";
            
            // 设置初始音乐信息
            musicInfo.textContent = musicTitle;
            
            // 初始化音乐播放器
            playBtn.addEventListener('click', async () => {
                if (!audio) {
                    audio = new Audio(musicUrl);
                    audio.addEventListener('ended', () => {
                        audio.currentTime = 0;
                        audio.play();
                    });
                }
                
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    avatar.classList.add('paused');
                    playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 3L12 8L4 13V3Z" fill="currentColor"/></svg>';
                    musicInfo.textContent = musicTitle + " (已暂停)";
                } else {
                    try {
                        await audio.play();
                        isPlaying = true;
                        avatar.classList.remove('paused');
                        playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 3H7V13H5V3ZM9 3H11V13H9V3Z" fill="currentColor"/></svg>';
                        musicInfo.textContent = musicTitle + " (播放中)";
                    } catch (err) {
                        console.error('播放失败:', err);
                        musicInfo.textContent = "播放失败，请点击重试";
                    }
                }
            });
            
            // 文字点击消失/恢复功能
            nameElement.addEventListener('click', () => {
                nameElement.classList.toggle('hidden');
            });
            
            // 头像点击恢复文字显示
            avatar.addEventListener('click', () => {
                nameElement.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
