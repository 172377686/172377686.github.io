<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿吱阿佐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1.5s ease;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at center, #0c0c0c, #000);
            position: relative;
        }
        
        body.daytime {
            background: radial-gradient(circle at center, #f0f9ff, #c2e9fb);
        }
        
        /* 昼夜切换按钮 - 响应式设计 */
        .mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: clamp(40px, 10vw, 50px);
            height: clamp(40px, 10vw, 50px);
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(5px);
            border: none;
            outline: none;
        }
        
        body.daytime .mode-toggle {
            background: rgba(255, 200, 50, 0.3);
        }
        
        .mode-toggle:hover {
            transform: scale(1.1);
        }
        
        .mode-icon {
            width: clamp(20px, 6vw, 24px);
            height: clamp(20px, 6vw, 24px);
            fill: white;
        }
        
        body.daytime .mode-icon {
            fill: #2c3e50;
        }
        
        /* 日光/月光效果 */
        .light-effect {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: -1;
            transition: all 1.5s ease;
        }
        
        .sun {
            background: radial-gradient(circle, #fff8b0, #ffcc00);
            top: 20%;
            left: 10%;
            transform: scale(0);
        }
        
        .moon {
            background: radial-gradient(circle, #e0e9ff, #a0b0ff);
            top: 20%;
            right: 10%;
            transform: scale(0);
        }
        
        body.daytime .sun {
            transform: scale(1);
        }
        
        body:not(.daytime) .moon {
            transform: scale(1);
        }
        
        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 35px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 0 3px rgba(100, 150, 255, .3), 0 0 20px 10px rgba(100, 150, 255, .5);
            animation: spin 16s linear infinite;
            cursor: pointer;
        }
        
        .avatar.paused {
            animation-play-state: paused;
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        body.daytime .avatar {
            box-shadow: 0 0 0 3px rgba(255, 200, 50, .3), 0 0 20px 10px rgba(255, 200, 50, .4);
        }
        
        .name {
            font-size: 42px;
            letter-spacing: 8px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 0 15px rgba(100, 150, 255, .8);
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
            cursor: pointer;
            text-align: center;
            padding: 0 20px;
        }
        
        .name:hover {
            transform: scale(1.03);
        }
        
        body.daytime .name {
            color: #2c3e50;
            text-shadow: 0 0 15px rgba(255, 200, 50, .5);
        }
        
        .name.hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }
        
        .bg-element {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }
        
        .bg-element:nth-child(1) {
            width: 350px;
            height: 350px;
            top: 10%;
            left: 10%;
            background: radial-gradient(circle, rgba(100, 150, 255, .1) 0, transparent 70%);
            animation: float 15s infinite alternate ease-in-out;
        }
        
        .bg-element:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: 15%;
            right: 15%;
            background: radial-gradient(circle, rgba(150, 100, 255, .1) 0, transparent 70%);
            animation: float 12s infinite alternate-reverse ease-in-out;
        }
        
        body.daytime .bg-element:nth-child(1) {
            background: radial-gradient(circle, rgba(100, 200, 255, .2) 0, transparent 70%);
        }
        
        body.daytime .bg-element:nth-child(2) {
            background: radial-gradient(circle, rgba(255, 200, 100, .2) 0, transparent 70%);
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }
        
        /* 音乐播放器样式 */
        .music-player {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        body.daytime .music-player {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .music-control {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .music-control:hover {
            background: rgba(100, 150, 255, 0.5);
            transform: scale(1.08);
        }
        
        body.daytime .music-control {
            background: rgba(255, 200, 50, 0.3);
        }
        
        body.daytime .music-control:hover {
            background: rgba(255, 200, 50, 0.5);
        }
        
        .music-info {
            color: white;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 120px;
        }
        
        body.daytime .music-info {
            color: #2c3e50;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .name {
                font-size: clamp(24px, 8vw, 32px);
                letter-spacing: 5px;
            }
            
            .avatar-container {
                width: clamp(120px, 40vw, 160px);
                height: clamp(120px, 40vw, 160px);
                margin-bottom: 25px;
            }
            
            .music-player {
                bottom: 15px;
                padding: 8px 15px;
                gap: 10px;
            }
            
            .light-effect {
                width: 200px;
                height: 200px;
                filter: blur(40px);
            }
            
            .mode-toggle {
                top: 15px;
                right: 15px;
                width: clamp(36px, 9vw, 40px);
                height: clamp(36px, 9vw, 40px);
            }
            
            .mode-icon {
                width: clamp(18px, 5vw, 20px);
                height: clamp(18px, 5vw, 20px);
            }
        }
        
        @media (max-width: 480px) {
            .mode-toggle {
                width: 36px;
                height: 36px;
            }
            
            .mode-icon {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <!-- 昼夜切换按钮 -->
    <button class="mode-toggle" id="modeToggle">
        <svg class="mode-icon" viewBox="0 0 24 24">
            <path id="modeIconPath" d="M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26 c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"/>
        </svg>
    </button>
    
    <!-- 日光/月光效果 -->
    <div class="light-effect sun"></div>
    <div class="light-effect moon"></div>
    
    <div class="avatar-container">
        <img src="https://xn--gew44p.cn/pA58nwn.jpg" alt="阿吱阿佐的头像" class="avatar" id="avatar">
    </div>
    
    <div class="name" id="name">阿吱阿佐</div>
    
    <div class="music-player" id="musicPlayer">
        <div class="music-control" id="playBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 3L12 8L4 13V3Z" fill="currentColor"/>
            </svg>
        </div>
        <div class="music-info" id="musicInfo">芊芊龍 - 期待夏天</div>
    </div>

    <script>
        // 昼夜模式检测
        function isDaytime() {
            const h = new Date().getHours();
            return h >= 6 && h < 18;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            if (isDaytime()) document.body.classList.add('daytime');
            
            const nameElement = document.getElementById('name');
            const avatar = document.getElementById('avatar');
            const playBtn = document.getElementById('playBtn');
            const musicInfo = document.getElementById('musicInfo');
            const modeToggle = document.getElementById('modeToggle');
            const modeIconPath = document.getElementById('modeIconPath');
            
            // 昼夜模式切换
            modeToggle.addEventListener('click', () => {
                document.body.classList.toggle('daytime');
                updateModeIcon();
            });
            
            // 更新模式图标
            function updateModeIcon() {
                const isDay = document.body.classList.contains('daytime');
                modeIconPath.setAttribute('d', isDay ? 
                    'M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M12,2L12,2 C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26 c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,2.04,12.46,2,12,2L12,2z' : 
                    'M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26 c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z'
                );
            }
            
            // 初始化图标
            updateModeIcon();
            
            // 音乐播放器功能
            let audio = null;
            let isPlaying = false;
            const musicUrl = "https://music.163.com/song/media/outer/url?id=2740145320.mp3";
            const musicTitle = "芊芊龍 - 期待夏天";
            
            // 设置初始音乐信息
            musicInfo.textContent = musicTitle;
            
            // 初始化音乐播放器
            playBtn.addEventListener('click', async () => {
                if (!audio) {
                    audio = new Audio(musicUrl);
                    audio.addEventListener('ended', () => {
                        audio.currentTime = 0;
                        audio.play();
                    });
                }
                
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    avatar.classList.add('paused');
                    playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 3L12 8L4 13V3Z" fill="currentColor"/></svg>';
                    musicInfo.textContent = musicTitle + " (已暂停)";
                } else {
                    try {
                        await audio.play();
                        isPlaying = true;
                        avatar.classList.remove('paused');
                        playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 3H7V13H5V3ZM9 3H11V13H9V3Z" fill="currentColor"/></svg>';
                        musicInfo.textContent = musicTitle + " (播放中)";
                    } catch (err) {
                        console.error('播放失败:', err);
                        musicInfo.textContent = "播放失败，请点击重试";
                    }
                }
            });
            
            // 文字点击消失/恢复功能
            nameElement.addEventListener('click', () => {
                nameElement.classList.toggle('hidden');
            });
            
            // 头像点击恢复文字显示
            avatar.addEventListener('click', () => {
                nameElement.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
